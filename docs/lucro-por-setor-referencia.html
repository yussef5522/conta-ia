<title>Lucro por Setor — referência v11 APROVADA</title>
<!--
═══════════════════════════════════════════════════════════════════════
  LUCRO POR SETOR — ARQUIVO DE REFERÊNCIA v11 (proposta ao dono, 11/11)
  v11: o seletor do ESTUDO vira o CARDÁPIO DO DIA INTEIRO (S23) —
  todos os setores, agrupados (na amostra: PIZZAS, XIS com o custo
  real 8,39, FRANGO FRITO; XIS CORAÇÃO demonstra o caso sem ficha).
  v10: o ESTUDO ganha SELETOR DE ITEM (S23, pedido do dono) — estuda
  qualquer item, com promo ou sem, subindo ou baixando preço; padrão =
  a promo detectada (ou o item que mais vendeu).
  v8 foi APROVADA pelo dono em 09/11. A v9 acrescentou, a pedido dele:
  S21 (o "E SE…" da promo: digita um preço e o sistema diz quantas
  unidades empatavam o lucro do dia e se a promo ganhou ou perdeu) e
  S22 (custo incompleto nunca se disfarça: sabor sem ficha vira selo
  âmbar no estudo, e a ficha se CRIA ali mesmo, na linha). Padrão da
  indústria: menu engineering (margem de contribuição em R$ + matriz
  de popularidade × margem — nossos selos do S6).
  ESTE ARQUIVO É LEI quando aprovado: tokens 1:1 com a cara do sistema,
  comentários = leis numeradas (S0–S22), <script> = especificação.
  Vive em docs/lucro-por-setor-referencia.html.
═══════════════════════════════════════════════════════════════════════

  S0 · UMA FÁBRICA SÓ. Custo de cada item vem da MESMA porta de fichas
      de "Quem paga a casa". Esta tela SOMA por setor/dia/produto;
      nunca recalcula custo por conta própria.

  S1 · O SELETOR É SÓ DIA. Chips de dias COM dado (HOJE entra com o
      que já tem, selo "até HH:MM") + 📅 escolher. Sem estado vazio
      decorativo.

  S2 · NÚMEROS MANDAM. Prosa proibida nos cards.

  S3 · UM CARD POR SETOR — setores REAIS do dono (S11): 🍕 PIZZAS ·
      🍔 XIS · 🥪 LANCHES · 🥙 PRENSADOS · 🍽 PRATOS · 🍗 FRANGO FRITO ·
      🥤 BEBIDAS. Card: VENDEU (R$+un) · CUSTO · LUCRO grande ·
      margem % · selo de cobertura (S4). Clicou → detalhe.

  S4 · HONESTIDADE DO CUSTO. Item sem ficha NUNCA entra no custo por
      estimativa. Selo verde "fichas 100%" ou âmbar "N un sem ficha →"
      com a lista (qtd) e atalho criar/mapear da revisão.

  S5 · PIZZA EM CAMADAS: CAMADA 1 = produto-tamanho como o PDV vende,
      cada um com ficha de base (massa + sacolas de queijo + molho +
      caixa). CAMADA 2 = SABORES somados do dia, cada um com ficha.
      Custo do setor = bases + sabores.

  S6 · QUADRANTE: ⭐ vende muito e lucra bem · 🐴 vende muito, lucra
      pouco · 💎 lucra muito, vende pouco (candidata a promo) · 🐶
      repensar. Corte: medianas de un e margem REAL do setor.

  S7 · VEREDITO EM REAIS contra a RÉGUA (mediana dos 4 mesmos
      dias-da-semana anteriores, sem promo): VALEU/NÃO VALEU ± R$,
      com "vender pouco e caro teria dado R$ X".

  S8 · HOJE é parcial (selo no chip) e não fecha veredito.

  S9 · Dia sem import = "importa o dia →", nunca zero mentiroso.

  S10· MOBILE PRIMEIRO (ver S18).

  S11· SETORES SÃO DO DONO (grupos editáveis ✎, família dos grupos do
      Radar/Consumo). Produto sem setor cai em "SEM SETOR" visível.

  S12· NÚMEROS DESTE ARQUIVO = AMOSTRA com a cara da casa (xis custo
      8,39 real). Cada pino vira teste contra a porta única no sprint.

  S13· TUDO CLICÁVEL E AJUSTÁVEL AQUI: linha abre A FICHA ALI MESMO —
      dose −/+, ✕ tira, busca adiciona (dose padrão) — recalculando
      em cascata: ficha → linha → setor → lucro → veredito. Gravação
      pela PORTA ÚNICA do editor de fichas; nunca segundo editor.

  S14· PROMO É DETECTADA: preço abaixo do usual do produto (mediana 4
      semanas) ou linha PRECINHO/PROMO acima do padrão → cartão
      "🏷 PROMO DETECTADA — estudar ↓" clicável. Dia sem promo: nada.
      O dono pode marcar/desmarcar na mão.

  S15· TELA MUDA, TELA LIMPA (LEI DA CASA, todas as telas). Nenhuma
      frase didática, legenda corrida ou "dica" no corpo. Explicação
      SÓ atrás de ⓘ. Número de lei nunca aparece na interface.

  S16· LINHA É COLUNA, NUNCA FRASE. Grade fixa alinhada, nome 700,
      número tabular à direita, cabecinha de coluna caps 9,5px.

  S17· (v7) A MESA DIZ O CUSTO INTEIRO. Cada produto da mesa mostra o
      custo VERDADEIRO = base + sabores QUE FORAM NELE (os com ficha),
      e a margem REAL sai disso. CLICAR NO PRODUTO abre o que foi
      dentro dele: base + cada sabor (qtd × ficha) + sem-ficha em
      âmbar + VENDEU/CUSTO/LUCRO do produto — é assim que se estuda
      "só o GRANDE PRECINHO" numa promoção. Sabor não ganha linha
      própria na mesa (não tem preço próprio); traço "—" proibido.

  S18· (v7) CELULAR NUNCA ESCONDE DINHEIRO. Coluna não some: vira
      segunda linha do item com rótulo pequeno (VENDEU · CUSTO ·
      MARGEM). Esconder custo foi medido como defeito pelo dono.

  S19· O DADO POR PRODUTO VEM DO PEDIDO, E SE PROVA: o arquivo do PDV
      traz cada sabor amarrado ao item do pedido (pedido → produto →
      sabores). A tela usa SÓ esse vínculo real; a Camada 2 é a soma.
      Todo número desce até a origem: "ver pedidos →" dentro do item
      lista os pedidos reais (nº, hora, sabores) que formaram o
      número. Dia cujo import não guardou o laço mostra só o total do
      setor — NUNCA se inventa quebra por produto sem dado.

  S20· (v8, ordem do dono) NUNCA MISTURAR UNIDADE E TOTAL NA MESMA
      LINHA. Colunas lado a lado são da MESMA grandeza: VENDEU total ×
      CUSTO total (ou un × un, nunca cruzado). "Preço 34,90 · custo
      61,70" lê-se como prejuízo — régua mista é defeito, não opção.

  S21· (v9, pedido do dono) O "E SE…" DA PROMO: o estudo da promo tem
      um campo de preço. O dono digita (ex.: 59,90) e o sistema
      responde NA HORA: lucro por unidade àquele preço, quantas
      unidades EMPATARIAM o lucro que a promo deu, e a régua de
      unidades do produto a preço cheio nos dias SEM promo (mediana).
      Veredito em R$: "a promo GANHOU +R$ X" ou "a preço cheio
      lucraria R$ X a mais". Custo usado = custo REAL por unidade da
      promo (base + sabores que saíram, pelo pedido). Só números e
      selos; explicação atrás do ⓘ (S15).

  S22· (v9, pedido do dono) CUSTO INCOMPLETO NUNCA SE DISFARÇA: se a
      promo/produto tem sabor SEM FICHA, o estudo mostra selo âmbar
      "⚠ N un sem ficha — custo incompleto" clicável (lista os
      sabores), o lucro exibido é "pelo menos" (só pode cair quando a
      ficha nascer), e a ficha se CRIA ALI MESMO: "criar ficha →" na
      linha abre ficha vazia com a busca do catálogo; com o primeiro
      insumo ela passa a contar no custo, em cascata, na mesma tela.
      Ficha vazia ainda conta como SEM ficha (custo zero não é custo).
      Gravação real sempre pela porta única do editor (S13).

  S23· (v10+v11, pedido do dono) O ITEM DO ESTUDO É ESCOLHA DO DONO,
      NO CARDÁPIO INTEIRO: o seletor lista TODOS os itens do dia, de
      TODOS os setores (pizza, xis, frango frito, prato, qualquer
      um), agrupados por setor. Padrão = a promo detectada (senão, o
      item que mais vendeu no dia). Serve pra estudar SUBIR ou BAIXAR
      o preço de qualquer item, promo ou não. O campo de preço começa
      no preço de HOJE do item. Comparador: item-promo usa a régua do
      GÊMEO a preço cheio (mapa GEMEO); item comum usa a própria
      régua de unidades dos dias normais. Dia sem régua do item: "em
      formação", nunca número inventado (S19). Item SEM ficha de
      produto: o estudo não inventa conta — mostra "criar ficha pra
      estudar →" e a ficha nasce ali (S22). Na amostra, XIS e FRANGO
      FRITO entram abertos no sábado; na tela real, todos os setores,
      todos os dias (o laço da API dá item a item).
-->
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --card-2:#F6F7FC;
  --linha:#E3E7F2; --linha-forte:#C9D0E3;
  --tinta:#0A0F1E; --tinta-2:#46516B; --tinta-3:#8B94AD;

  --coral:#E2544A; --coral-chao:#9F2D25; --coral-50:#FDECEA; --coral-tinta:#8C251E;

  --linha:#242A41; --linha-forte:#333B58;
  --tinta:#EDF0FB; --tinta-2:#9AA3C0; --tinta-3:#5E6683;
  --acao:#818CF8; --acao-50:#23264F; --acao-tinta:#C7CBFF;
  --verde:#34D399; --verde-50:#0C2E24; --verde-tinta:#8CEAC8;
  --coral:#F87168; --coral-50:#3A1917; --coral-tinta:#FFB4AE;
  --ambar:#F59E0B; --ambar-50:#352508; --ambar-tinta:#FCD38D;
  --sombra:none;
}}
:root[data-theme="dark"]{
  --bg:#0B0E1C; --card:#141829; --card-2:#1A1F33;
  --linha:#242A41; --linha-forte:#333B58;
  --tinta:#EDF0FB; --tinta-2:#9AA3C0; --tinta-3:#5E6683;
  --acao:#818CF8; --acao-50:#23264F; --acao-tinta:#C7CBFF;
  --verde:#34D399; --verde-50:#0C2E24; --verde-tinta:#8CEAC8;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tinta);font-family:var(--font)}
body{padding:14px 16px 60px;max-width:1060px;margin:0 auto}
h1{font-size:21px;margin:4px 0 10px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.chip{border:1px solid var(--linha-forte);background:var(--card);color:var(--tinta-2);
  border-radius:var(--r-pilula);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acao);border-color:var(--acao);color:#fff}
.selo-parcial{font-size:10.5px;font-weight:800;margin-left:5px;opacity:.85}
.promo-card{display:flex;align-items:center;gap:10px;background:var(--acao-50);
  border:1px solid var(--acao);border-radius:var(--r-cartao);padding:10px 14px;
  margin:8px 0 14px;font-size:13px;color:var(--acao-tinta);font-weight:700;cursor:pointer;flex-wrap:wrap}
.promo-card .tag{background:var(--acao);color:#fff;border-radius:var(--r-pilula);
  padding:2px 10px;font-size:11px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}
.setor{background:var(--card);border:1px solid var(--linha-forte);border-radius:var(--r-painel);
  box-shadow:var(--sombra);padding:13px 15px;cursor:pointer}
.setor.sel{outline:2px solid var(--acao);outline-offset:1px}
.setor .nome{font-size:13.5px;font-weight:800;display:flex;gap:7px}
.setor .lin{display:flex;justify-content:space-between;font-size:12px;color:var(--tinta-2);margin-top:6px}
.setor .lin b{color:var(--tinta);font-variant-numeric:tabular-nums}
.setor .lucro{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.setor .lucro.pos{color:var(--verde)} .setor .lucro.neg{color:var(--coral)}
.pill{font-size:11px;font-weight:800;border-radius:var(--r-pilula);padding:2px 9px;display:inline-block}
.pill.marg{background:var(--acao-50);color:var(--acao-tinta)}
.cob{margin-top:8px;font-size:11px;font-weight:700;border-radius:var(--r-pilula);
  padding:4px 10px;display:inline-block;cursor:pointer}
.cob.ok{background:var(--verde-50);color:var(--verde-tinta)}
.cob.gap{background:var(--ambar-50);color:var(--ambar-tinta)}
.painel{background:var(--card);border:1px solid var(--linha-forte);border-radius:var(--r-painel);
  box-shadow:var(--sombra);padding:16px;margin-top:16px}
.painel h2{font-size:15px;margin:0 0 10px}
.camada{background:var(--card-2);border:1px solid var(--linha);border-radius:var(--r-cartao);
  padding:11px 13px;margin-top:10px}
.camada .t{font-size:12px;font-weight:800;color:var(--tinta-2);letter-spacing:.04em;margin-bottom:7px}
/* S16 · grades */
.head{display:grid;gap:10px;font-size:9.5px;font-weight:800;letter-spacing:.07em;
  color:var(--tinta-3);text-transform:uppercase;padding:0 0 6px;border-bottom:2px solid var(--linha-forte)}
.head span.r{text-align:right}
.row{padding:0;border-bottom:1px solid var(--linha);cursor:pointer}
.row:last-child{border-bottom:0}
.cab{display:grid;gap:10px;align-items:center;padding:8px 0}
.g5 .head,.g5 .cab{grid-template-columns:46px 1fr 92px 96px 18px}
.g6 .head,.g6 .cab{grid-template-columns:46px 1fr 104px 100px 88px 34px}
.qtd{font-weight:800;font-size:13.5px;background:var(--card);border:1px solid var(--linha-forte);
  border-radius:8px;text-align:center;padding:4px 0;font-variant-numeric:tabular-nums}
.nm{font-weight:700;font-size:13.5px;letter-spacing:-.01em;line-height:1.25}
.apoio{font-size:12px;color:var(--tinta-3);text-align:right;font-variant-numeric:tabular-nums}
.forte{font-weight:800;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}

.badge{font-size:16px;text-align:center}

.row.sem .qtd{background:var(--ambar-50);border-color:var(--ambar);color:var(--ambar-tinta)}
.row.sem .nm,.row.sem .forte{color:var(--ambar-tinta)}
.tagp{background:var(--acao);color:#fff;border-radius:var(--r-pilula);padding:1px 8px;
  font-size:10px;font-weight:800;margin-left:7px;vertical-align:1px}
.btn-mini{font-size:11px;font-weight:800;color:var(--acao);background:var(--acao-50);
  border:0;border-radius:var(--r-pilula);padding:3px 10px;cursor:pointer;margin-left:8px}

.ficha{background:var(--card);border:1px dashed var(--linha-forte);border-radius:var(--r-cartao);

.ficha .q{color:var(--tinta-3);font-size:11px;margin-left:5px;font-weight:400}
.ficha .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;font-size:12px}

.ficha .dose{display:flex;align-items:center;gap:6px}

  background:var(--card-2);color:var(--tinta);font-weight:800;cursor:pointer;font-size:13px}
.ficha .dose b{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px}

.add .opt b{color:var(--acao-tinta)} .add .opt:hover{background:var(--acao-50)}

/* S17 · a conta do PRODUTO: base + sabores dele (com ficha) */
function contaProduto([nome,q,preco,sabores]){
  const cb=custoFicha(nome);
  let custo=cb==null?0:q*cb, semFicha=cb==null?[[nome,q]]:[];
  for(const [sab,qs] of sabores||[]){
    const cf=custoFicha(sab);
    if(cf==null)semFicha.push([sab,qs]); else custo+=qs*cf;
  }
  return {nome,q,preco,vendeu:q*preco,custo,semFicha,semBase:cb==null,
          m:100*((q*preco-custo)/(q*preco)),promo:!!(FICHAS[nome]&&FICHAS[nome].promo),sabores:sabores||[]};
}
function contaPizza(p){
  let vendeu=0,un=0,custo=0,semFicha=[];
  for(const prod of p.produtos){const c=contaProduto(prod);
    vendeu+=c.vendeu;un+=c.q;custo+=c.custo;semFicha.push(...c.semFicha);}
  const agg={};for(const [s,q] of semFicha)agg[s]=(agg[s]||0)+q;
  return {vendeu,un,custo,semFicha:Object.entries(agg)};
}
/* Camada 2 = soma dos sabores por produto (S19: uma fonte) */
function saboresDoDia(p){
  const agg={};
  for(const [,,,sabs] of p.produtos)for(const [s,q] of sabs||[])agg[s]=(agg[s]||0)+q;
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]);
}
const contaSetor=s=>s.produtos?contaPizza(s):{vendeu:s.vendeu,un:s.un,custo:s.custo,semFicha:s.semFicha};

function detectaPromo(dia){
  const p=dia.setores['🍕 PIZZAS'];if(!p)return null;
  for(const [nome,q,preco] of p.produtos){
    const f=FICHAS[nome];
    if((f&&f.promo&&q>=10)||preco<PRECO_USUAL[nome]-0.01)
      return {nome,q,preco,usual:PRECO_USUAL['PIZZA GRANDE 35CM']};
  }
  return null;
}

const $=id=>document.getElementById(id);

function render(){

    <span style="font-weight:600;color:var(--tinta-2)">(normal R$ ${fmt(pr.usual)})</span> · ${pr.q} un — estudar ↓</div>`:'';

  let html='';

      <div class="lucro ${lucro>=0?'pos':'neg'}">R$ ${fmt(lucro)}</div>
      <span class="pill marg">margem ${marg.toFixed(1)}%</span> ${cob}</div>`;
  }
  $('setores').innerHTML=html;
  renderDetalhe(dia);renderPromo(dia);
}

function blocoFicha(nome){
  const f=FICHAS[nome];if(!f)return'';
  const ings=f.ing.map(([n,d,u,p],i)=>`<div class="ing"><span>${n}<span class="q">R$ ${fmt(p)}/${u}</span></span>
    <span class="dose"><button onclick="event.stopPropagation();dose('${nome}',${i},-1)">−</button>
    <b>${u==='UN'?d+' UN':fmt(d)+' '+u}</b>
    <button onclick="event.stopPropagation();dose('${nome}',${i},1)">+</button>
    <span class="v">R$ ${fmt(d*p)}</span>
    <button class="x" onclick="event.stopPropagation();tiraIng('${nome}',${i})">✕</button></span></div>`).join('');
  const add=buscaEm===nome
    ?`<div class="add"><input placeholder="buscar insumo…" autofocus onclick="event.stopPropagation()" oninput="filtra(this)">
      ${CATALOGO.map(([n,p,u],i)=>`<button class="opt" onclick="event.stopPropagation();addIng('${nome}',${i})"><b>+</b> ${n} · R$ ${fmt(p)}/${u}</button>`).join('')}</div>`
    :`<div class="add"><button class="btn-mini" onclick="event.stopPropagation();abreBusca('${nome}')">+ adicionar ingrediente</button></div>`;
  return `<div class="ficha" onclick="event.stopPropagation()">${ings}
    <div class="rodape"><span>custo da ficha</span><span>R$ ${fmt(custoFicha(nome)||0)}</span></div>${add}</div>`;
}
function dose(nome,i,s){const g=FICHAS[nome].ing[i];const p=g[2]==='UN'?1:0.01;
  g[1]=Math.max(0,+(g[1]+s*p).toFixed(2));render();}
function tiraIng(nome,i){FICHAS[nome].ing.splice(i,1);render();}
function abreBusca(nome){buscaEm=nome;render();}
function filtra(inp){const q=inp.value.toLowerCase();
  [...inp.parentElement.querySelectorAll('.opt')].forEach(b=>
    b.style.display=b.textContent.toLowerCase().includes(q)?'block':'none');}
function addIng(nome,idx){const [n,p,u]=CATALOGO[idx];
  FICHAS[nome].ing.push([n,u==='UN'?1:0.05,u,p]);buscaEm=null;render();}
/* S22 · a ficha nasce na própria linha: vazia + busca aberta */
function criarFicha(n){if(!FICHAS[n])FICHAS[n]={ing:[]};fichaAberta=n;buscaEm=n;render();}
function criarFichaEm(set,n){setorAberto=set;criarFicha(n);
  requestAnimationFrame(()=>$('detalhe').scrollIntoView({behavior:'smooth'}));}

function renderDetalhe(dia){
  const s=dia.setores[setorAberto];
  if(!s||!s.produtos){$('detalhe').classList.add('oculto');$('mesa').classList.add('oculto');return;}
  const c=contaPizza(s);
  let base=`<div class="head"><span>UN</span><span>ITEM</span><span class="r">VENDEU</span><span class="r">CUSTO FICHA</span><span></span></div>`;
  for(const [nome,q,preco] of s.produtos){
    const aberta=fichaAberta===nome,cb=custoFicha(nome);
    base+=`<div class="row ${cb==null?'sem':''}" onclick="${cb==null?`criarFicha('${nome}')`:`abreFicha('${nome}')`}"><div class="cab">
      <span class="qtd">${q}</span>
      <span class="nm">${nome}${FICHAS[nome]&&FICHAS[nome].promo?'<span class="tagp">PROMO</span>':''}${cb==null?`<button class="btn-mini" onclick="event.stopPropagation();criarFicha('${nome}')">${FICHAS[nome]?'abrir ficha →':'criar ficha →'}</button>`:''}</span>
      <span class="stats"><span class="apoio" style="font-weight:700;color:var(--tinta)"><span class="rot">vendeu</span>R$ ${fmt(q*preco)}</span>
      <span class="forte"><span class="rot">custo ficha</span>${cb==null?'sem ficha':'R$ '+fmt(q*cb)}</span></span>
      <span class="chev">${aberta?'▲':'▼'}</span></div>${aberta&&FICHAS[nome]?blocoFicha(nome):''}</div>`;
  }
  let sab=`<div class="head"><span>UN</span><span>SABOR</span><span class="r">FICHA</span><span class="r">CUSTO</span><span></span></div>`;
  for(const [nome,q] of saboresDoDia(s)){
    const cf=custoFicha(nome),aberta=fichaAberta===nome;
    sab+= cf==null
      ?`<div class="row sem"><div class="cab">
        <span class="qtd">${q}</span>
        <span class="nm">${nome}<button class="btn-mini" onclick="event.stopPropagation();criarFicha('${nome}')">${FICHAS[nome]?'abrir ficha →':'criar ficha →'}</button></span>
        <span class="stats"><span class="apoio"></span><span class="forte">sem ficha</span></span>
        <span class="chev"></span></div>${FICHAS[nome]&&fichaAberta===nome?blocoFicha(nome):''}</div>`
      :`<div class="row" onclick="abreFicha('${nome}')"><div class="cab">
        <span class="qtd">${q}</span>
        <span class="nm">${nome}</span>
        <span class="stats"><span class="apoio"><span class="rot">ficha</span>R$ ${fmt(cf)}</span>
        <span class="forte"><span class="rot">custo</span>R$ ${fmt(q*cf)}</span></span>
        <span class="chev">${aberta?'▲':'▼'}</span></div>${aberta?blocoFicha(nome):''}</div>`;
  }
  const temSab=saboresDoDia(s).length>0;
  $('detalhe').classList.remove('oculto');
  $('detalhe').innerHTML=`<h2>${setorAberto}<button class="i" onclick="event.stopPropagation();this.nextElementSibling.classList.toggle('oculto')">i</button><span class="pop oculto">custo do item = ficha do produto (na pizza: base do tamanho) + ficha de cada sabor que foi nele · clique numa linha pra abrir e ajustar a ficha</span></h2>
    <div class="camada g5"><div class="t">CAMADA 1 · O QUE VENDEU</div>${base}</div>
    ${temSab?`<div class="camada g5"><div class="t">CAMADA 2 · SABORES DO DIA</div>${sab}</div>`:''}
    <div class="tot"><span>CUSTO TOTAL DO SETOR</span><span>R$ ${fmt(c.custo)}</span></div>
    <div class="tot" style="border:0;margin-top:2px"><span>VENDEU</span><span>R$ ${fmt(c.vendeu)}</span></div>
    <div class="tot" style="border:0;margin-top:2px;color:var(--verde)"><span>LUCRO DO SETOR</span><span>R$ ${fmt(c.vendeu-c.custo)}</span></div>`;
  renderMesa(s);
}

/* S17 · mesa: custo inteiro do produto + abre o que foi dentro dele */
function blocoDentro(c){
  const cb=custoFicha(c.nome);
  const basas=cb==null
    ?`<div class="lin2 sf"><span>⚠ ficha de ${c.nome}<span class="q">× ${c.q}</span><button class="btn-mini" onclick="event.stopPropagation();criarFicha('${c.nome}')">criar ficha →</button></span><span>sem ficha</span></div>`
    :`<div class="lin2"><span>ficha ${c.nome}<span class="q">× ${c.q}</span></span><span>R$ ${fmt(c.q*cb)}</span></div>`;
  const sabs=c.sabores.map(([s,q])=>{const cf=custoFicha(s);
    return cf==null
      ?`<div class="lin2 sf"><span>⚠ ${s}<span class="q">× ${q}</span><button class="btn-mini" onclick="event.stopPropagation();criarFicha('${s}')">criar ficha →</button></span><span>sem ficha</span></div>`
      :`<div class="lin2"><span>${s}<span class="q">× ${q} · ficha R$ ${fmt(cf)}</span></span><span>R$ ${fmt(q*cf)}</span></div>`;}).join('');
  return `<div class="dentro" onclick="event.stopPropagation()">${basas}${sabs}
    <div class="fecho"><span>VENDEU</span><span>R$ ${fmt(c.vendeu)}</span></div>
    <div class="fecho"><span>CUSTO</span><span>R$ ${fmt(c.custo)}</span></div>
    <div class="fecho lucro"><span>LUCRO DO ITEM</span><span>R$ ${fmt(c.vendeu-c.custo)}</span></div>
    <div style="margin-top:7px"><button class="btn-mini" style="margin:0" onclick="event.stopPropagation();verPedidos('${c.nome}')">ver pedidos →</button></div></div>`;
}
function renderMesa(s){
  const linhas=s.produtos.map(contaProduto);
  const med=a=>{const x=[...a].sort((p,q)=>p-q);return x.length?x[Math.floor((x.length-1)/2)]:0};
  const unMed=med(linhas.map(l=>l.q)),mgMed=med(linhas.map(l=>l.m));
  const badge=l=>l.q>=unMed?(l.m>=mgMed?'⭐':'🐴'):(l.m>=mgMed?'💎':'🐶');
  $('mesa').classList.remove('oculto');
  $('mesa').innerHTML=`<h2>Itens do setor<button class="i" onclick="this.nextElementSibling.classList.toggle('oculto')">i</button><span class="pop oculto">custo e margem aqui são INTEIROS: base + sabores que foram no item · clique no item pra abrir o que foi dentro dele · ⭐ vende muito e lucra bem · 🐴 vende muito, lucra pouco — cuidado em promoção · 💎 lucra muito, vende pouco — candidata a promoção · 🐶 nem um nem outro</span></h2>
    <div class="camada g6"><div class="head"><span>UN</span><span>ITEM</span><span class="r">VENDEU</span><span class="r">CUSTO</span><span class="r">MARGEM</span><span></span></div>
    ${linhas.map(l=>{const aberta=itemAberto===l.nome;
      return `<div class="row" onclick="abreItem('${l.nome}')"><div class="cab">
      <span class="qtd">${l.q}</span>
      <span class="nm">${l.nome}${l.promo?'<span class="tagp">PROMO</span>':''}${l.semFicha.length?' <span style="color:var(--ambar-tinta);font-size:11px;font-weight:800">⚠</span>':''}</span>
      <span class="stats"><span class="apoio" style="font-weight:700;color:var(--tinta)"><span class="rot">vendeu</span>R$ ${fmt(l.vendeu)}</span>
      <span class="forte"><span class="rot">custo</span>R$ ${fmt(l.custo)}</span>
      <span class="mg">${l.m.toFixed(1)}%</span></span>
      <span class="badge">${badge(l)} <span class="chev">${aberta?'▲':'▼'}</span></span></div>
      ${aberta?blocoDentro(l):''}</div>`;}).join('')}</div>`;
}

function renderPromo(dia){
  const r=dia.regua['🍕 PIZZAS'];
  if(!r||dia.parcial){$('promo').innerHTML='';$('promo').style.display='none';return;}
  $('promo').style.display='';
  const c=contaPizza(dia.setores['🍕 PIZZAS']);
  const lucroDia=c.vendeu-c.custo,lucroReg=r.vendeu-r.custo,delta=lucroDia-lucroReg,valeu=delta>=0;
  eseDados=estudoDoItem(dia);
  $('promo').innerHTML=`<h2>Veredito — 🍕 ${diaAtual}<button class="i" onclick="this.nextElementSibling.classList.toggle('oculto')">i</button><span class="pop oculto">comparado com a régua: a mediana dos 4 mesmos dias-da-semana anteriores, sem promoção · dia parcial não fecha veredito · no E SE, o custo é o custo real por unidade da promo (base + sabores que saíram) e a régua é quantas unidades do produto a preço cheio saem num dia típico sem promo · lucro com sabor sem ficha é "pelo menos": só muda quando a ficha nascer</span></h2>
    <div class="v-grid">
      <div class="v-cel">vendeu<b>${c.un} un <span style="font-size:12px;color:var(--tinta-3)">(régua ${r.un})</span></b></div>
      <div class="v-cel">entrou<b>R$ ${fmt(c.vendeu)}</b></div>
      <div class="v-cel">custou<b>R$ ${fmt(c.custo)}</b></div>
      <div class="v-cel">lucro do dia<b>R$ ${fmt(lucroDia)}</b></div></div>
    <div class="veredito ${valeu?'ok':'ruim'}">
      ${valeu?'✓ A PROMOÇÃO VALEU':'✗ A PROMOÇÃO NÃO VALEU'} —
      <b>R$ ${valeu?'+':''}${fmt(delta)}</b> de lucro vs um dia normal
      <div style="font-size:12.5px;margin-top:5px">vender pouco e caro (dia normal) daria R$ ${fmt(lucroReg)} · ${valeu?'a promo deu':'a promo deu só'} R$ ${fmt(lucroDia)}</div></div>
    ${eseDados?eseHtml(eseDados):''}`;
}

/* ═══════ S21/S23 · o "E SE…" — estudo do item QUE O DONO ESCOLHER ═══════ */
let PRECO_ESE=null,eseDados=null,ITEM_ESTUDO=null;
function estudoDoItem(dia){
  /* S23 · o cardápio do dia inteiro: todos os setores com itens */
  const grupos=Object.entries(dia.setores).filter(([,s])=>s.produtos&&s.produtos.length);
  if(!grupos.length)return null;
  const todos=grupos.flatMap(([set,s])=>s.produtos.map(p=>({set,p})));
  const pr=detectaPromo(dia);
  let alvo=ITEM_ESTUDO?todos.find(t=>t.p[0]===ITEM_ESTUDO):null;
  if(!alvo)alvo=(pr&&todos.find(t=>t.p[0]===pr.nome))
    ||[...todos].sort((a,b)=>b.p[1]*b.p[2]-a.p[1]*a.p[2])[0];
  const c=contaProduto(alvo.p);
  const inc=c.semFicha.reduce((a,[,q])=>a+q,0);
  const nomeCheio=GEMEO[c.nome]||c.nome;
  return {...c,inc,lucro:c.vendeu-c.custo,custoUn:c.custo/c.q,setor:alvo.set,
          cheioUn:(dia.reguaProduto&&dia.reguaProduto[nomeCheio])??null,nomeCheio,
          grupos:grupos.map(([set,s])=>[set,s.produtos.map(p=>p[0])])};
}
function eseConta(e,preco){
  const lucroUn=preco-e.custoUn;
  if(lucroUn<=0)return {lucroUn,empate:null,lucroCheio:null,delta:null};
  const empate=Math.ceil(e.lucro/lucroUn);
  const lucroCheio=e.cheioUn!=null?e.cheioUn*lucroUn:null;
  return {lucroUn,empate,lucroCheio,delta:lucroCheio!=null?e.lucro-lucroCheio:null};
}
function eseHtml(e){
  if(PRECO_ESE==null)PRECO_ESE=e.preco; /* S23 · começa no preço de HOJE do item */
  const sel=`<select class="selit" onchange="trocaItemEstudo(this.value)">${
    e.grupos.map(([set,ns])=>`<optgroup label="${set}">${
      ns.map(n=>`<option${n===e.nome?' selected':''}>${n}</option>`).join('')}</optgroup>`).join('')}</select>`;
  const topo=`<div class="t" style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">ESTUDO DO ITEM ${sel}${e.promo?'<span class="tagp">PROMO</span>':''}</div>`;
  /* S22/S23 · item sem ficha de produto: não inventa conta */
  if(e.semBase)return `<div class="camada">${topo}
    <div class="v-grid"><div class="v-cel">vendeu hoje · a R$ ${fmt(e.preco)}<b>${e.q} un · R$ ${fmt(e.vendeu)}</b></div></div>
    <div style="margin-top:9px"><span class="cob gap" onclick="criarFichaEm('${e.setor}','${e.nome}')">⚠ item sem ficha — criar ficha pra estudar →</span></div></div>`;
  const r=eseConta(e,PRECO_ESE);
  const selo=e.inc?`<span class="cob gap" onclick="abreGaps('${e.setor}')">⚠ ${e.inc} un sem ficha — custo incompleto, lucro é "pelo menos" →</span>`
                  :`<span class="cob ok">fichas 100% ✓</span>`;
  return `<div class="camada">${topo}
    <div class="v-grid">
      <div class="v-cel">vendeu hoje · a R$ ${fmt(e.preco)}<b>${e.q} un · R$ ${fmt(e.vendeu)}</b></div>
      <div class="v-cel">custou (base + sabores)<b>R$ ${fmt(e.custo)}</b></div>
      <div class="v-cel">lucro de hoje<b>R$ ${fmt(e.lucro)}</b></div>
      <div class="v-cel">lucro por unidade<b>R$ ${fmt(e.lucro/e.q)}</b></div></div>
    <div style="margin-top:9px">${selo}</div>
    <div class="ese"><span class="t2">e se vendesse a</span>
      <span class="money">R$ <input id="eseP" value="${fmt(PRECO_ESE)}" inputmode="decimal" oninput="eseInput(this.value)"></span>
      <span class="v-cel" style="flex:1 1 120px">lucro por un<b id="eseLu">${r.lucroUn>0?'R$ '+fmt(r.lucroUn):'não paga o custo'}</b></span>
      <span class="v-cel" style="flex:1 1 120px">pra empatar hoje<b id="eseEm">${r.empate!=null?r.empate+' un':'·'}</b></span>
      <span class="v-cel" style="flex:1 1 120px">régua dias normais${e.nomeCheio!==e.nome?' ('+e.nomeCheio+')':''}<b>${e.cheioUn!=null?e.cheioUn+' un':'em formação'}</b></span></div>
    <div id="eseVer">${eseVerHtml(e,r)}</div></div>`;
}
function eseVerHtml(e,r){
  if(r.delta==null)return'';
  const ok=r.delta>=0;
  const ganhou=e.promo?'✓ A PROMO GANHOU':'✓ COMO FOI HOJE GANHA';
  const perdeu=e.promo?'✗ A PREÇO CHEIO LUCRARIA MAIS':'✗ A ESSE PREÇO LUCRARIA MAIS';
  return `<div class="veredito ${ok?'ok':'ruim'}" style="margin-top:10px">
    ${ok?ganhou:perdeu} — <b>${ok?'R$ +'+fmt(r.delta):'R$ +'+fmt(Math.abs(r.delta))+' a mais'}</b>
    <div style="font-size:12.5px;margin-top:5px">${e.cheioUn} un a R$ ${fmt(PRECO_ESE)} dariam R$ ${fmt(r.lucroCheio)} · hoje deu R$ ${fmt(e.lucro)}</div></div>`;
}
function trocaItemEstudo(n){ITEM_ESTUDO=n;PRECO_ESE=null;render()}
function eseInput(v){
  const p=parseFloat(String(v).trim().replace(',','.'));
  if(!eseDados||!isFinite(p)||p<=0)return;
  PRECO_ESE=p;
  const r=eseConta(eseDados,p);
  document.getElementById('eseLu').textContent=r.lucroUn>0?'R$ '+fmt(r.lucroUn):'não paga o custo';
  document.getElementById('eseEm').textContent=r.empate!=null?r.empate+' un':'·';
  document.getElementById('eseVer').innerHTML=eseVerHtml(eseDados,r);
}

function trocaDia(d){diaAtual=d;fichaAberta=null;itemAberto=null;buscaEm=null;PRECO_ESE=null;ITEM_ESTUDO=null;render()}
function abreSetor(n){setorAberto=n;fichaAberta=null;itemAberto=null;buscaEm=null;render()}
function abreFicha(n){fichaAberta=fichaAberta===n?null:n;buscaEm=null;render()}
function abreItem(n){itemAberto=itemAberto===n?null:n;render()}
function estudaPromo(nome){itemAberto=nome;render();
  requestAnimationFrame(()=>$('mesa').scrollIntoView({behavior:'smooth'}));}
/* S19 · a prova: todo número desce até o pedido (amostra) */
function verPedidos(nome){
  const c=contaProduto(DIAS[diaAtual].setores[setorAberto].produtos.find(p=>p[0]===nome));
  const ex=[['#4821','19:42'],['#4838','20:05'],['#4846','20:18'],['#4871','21:02']];
  const linhas=[];let i=0;
  const fonte=c.sabores.length?c.sabores:[[null,c.q]];
  for(const [s] of fonte){
    const [num,hora]=ex[i++%ex.length];
    linhas.push(num+' · '+hora+' · 1× '+nome+(s?' → '+s:''));}
  alert('PEDIDOS DE '+nome+' ('+diaAtual+') — amostra:\n\n'+linhas.join('\n')+
    '\n… ('+c.q+' pedidos no total)\n\nNa tela real: a lista completa, do import do dia,\ncada sabor amarrado ao item do pedido como o PDV mandou.');
}
function abreGaps(n){
  const c=contaSetor(DIAS[diaAtual].setores[n]);
  alert('SEM FICHA em '+n+':\n\n'+c.semFicha.map(([nome,q])=>'⚠ '+nome+' × '+q+'  → criar/mapear').join('\n'));
}
render();
</script>

</html>
