# Tranca da porta SSH — auditoria out/2026
#
# CAMINHO REAL NO SERVIDOR: /etc/ssh/sshd_config.d/00-caixaos-tranca.conf
# (CAIXAOS prod · root@198.211.103.10 · aplicado 27/10/2026)
#
# POR QUE DROP-IN E NÃO EDITAR O sshd_config: reverter é `rm` deste arquivo +
# `systemctl reload ssh`. O /etc/ssh/sshd_config original fica intocado (cópia em
# /etc/ssh/sshd_config.bak-20261027).
#
# ⚠️ POR QUE O PREFIXO `00-` IMPORTA: no sshd a PRIMEIRA ocorrência de uma diretiva
# VENCE, e o `Include /etc/ssh/sshd_config.d/*.conf` está na linha 12 do sshd_config
# (antes do `PermitRootLogin yes` da linha 42). Os drop-ins são lidos em ordem
# alfabética, e este servidor já tinha DOIS do cloud-init que se contradizem:
#   50-cloud-init.conf        → PasswordAuthentication yes   ← era este que vencia
#   60-cloudimg-settings.conf → PasswordAuthentication no
# Com `00-`, este arquivo é lido primeiro e ganha dos dois. Renomear pra um número
# acima de 50 FAZ A SENHA VOLTAR, em silêncio.
#
# O que a auditoria achou antes disto: 1,79 milhão de tentativas de login falhas,
# PermitRootLogin yes, PasswordAuthentication yes, fail2ban nem instalado.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
MaxAuthTries 4
